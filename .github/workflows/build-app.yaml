name: CI Pipeline - E-commerce Java

on:
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  # -------------------------------------------------------------
  # JOB 1: Compilación del proyecto (BUILD)
  # -------------------------------------------------------------
  build:
    name: Build Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Intenta compilar con Gradle Wrapper si existe, de lo contrario con Maven
      - name: Build Application
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assemble -x test
          else
            mvn clean compile -DskipTests
          fi

  # -------------------------------------------------------------
  # JOB 2: Pruebas unitarias (TEST) - Depende de 'build'
  # -------------------------------------------------------------
  test:
    name: Run Unit Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run Tests
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew test
          else
            mvn test
          fi

  # -------------------------------------------------------------
  # JOB 3: Análisis Estático de Seguridad (CodeQL) - Depende de 'test'
  # -------------------------------------------------------------
  codeql-analysis:
    name: CodeQL Security Analysis
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # -------------------------------------------------------------
  # JOB 4: Docker Build, Escaneo Trivy y Publicación - Depende de 'test' y 'codeql-analysis'
  # -------------------------------------------------------------
  docker:
    name: Docker Build, Scan & Push
    needs: [test, codeql-analysis]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Metadata (Tags) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Push Docker Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}