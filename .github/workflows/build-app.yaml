name: CI Pipeline - E-commerce Java

on:
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  # -------------------------------------------------------------
  # JOB 1: Compilación del proyecto (BUILD)
  # -------------------------------------------------------------
  build:
    name: Build Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Application with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew bootJar -x test || ./gradlew build -x test
          else
            mvn clean package -DskipTests
          fi

      # PASO CLAVE: Guardar el archivo .jar generado para usarlo en el job de Docker
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*-SNAPSHOT.jar
          retention-days: 1

  # -------------------------------------------------------------
  # JOB 2: Pruebas unitarias (TEST)
  # -------------------------------------------------------------
  test:
    name: Run Unit Tests
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ecommerce
          POSTGRES_USER: store
          POSTGRES_PASSWORD: 123456
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run Tests
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew test
          else
            mvn test
          fi

  # -------------------------------------------------------------
  # JOB 3: Análisis Estático de Seguridad (CodeQL)
  # -------------------------------------------------------------
  codeql-analysis:
    name: CodeQL Security Analysis
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # -------------------------------------------------------------
  # JOB 4: Docker Build, Escaneo Trivy y Publicación
  # -------------------------------------------------------------
  docker:
    name: Docker Build, Scan & Push
    needs: [test, codeql-analysis]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # PASO CLAVE: Descargar el archivo .jar generado en el job de build
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: build/libs/

      - name: Extract Metadata (Tags) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image Locally
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Push Docker Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}